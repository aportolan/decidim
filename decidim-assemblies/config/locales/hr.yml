    help:
      participatory_spaces:
        assemblies:
          page: '<p><strong>Skupština</strong> je grupa članova organizacije koji se povremeno sastaju kako bi donosili odluke o specifičnom području.</p> <p>Skupštine održavaju sastanke, neki su privatni, a neki otvoreni.</p>

            '
          contextual: '<p><strong>Skupština</strong> je grupa članova organizacije koji se povremeno sastaju kako bi donosili odluke o specifičnom području ili opsegu organizacije.</p> <p>Skupštine održavaju sastanke, neki su privatni, a neki otvoreni. Ako su otvoreni, moguće je sudjelovati (npr. prisustvovanje, dodavanje točaka dnevnog reda ili komentiranje prijedloga i odluka).</p> <p>Primjeri: glavna skupština, savjetodavno vijeće za ravnopravnost, povjerenstvo za evaluaciju ili jamstveno tijelo — sve su primjeri skupština.</p>

            '
