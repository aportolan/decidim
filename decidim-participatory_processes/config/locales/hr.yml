      static_pages:
        democratic_quality_indicators:
          content: "<h2>Sustav pokazatelja za mjerenje pokazatelja kvalitete u Decidimu.</h2>\n\n<h3>Uvod</h3>\n<p>Demokratska kvaliteta temeljno je načelo Decidima. Kako bismo to podržali, razvili smo sustav pokazatelja koji pomažu u procjeni kvalitete participativnih procesa na platformi. Ovaj članak objašnjava kako se ti pokazatelji izračunavaju.</p>\n\n<h3>Kako se pokazatelji izračunavaju?</h3>\n<p>Definirali smo dvije metode prikupljanja pokazatelja kvalitete:</p>\n\n<ol>\n  <li><strong>Automatske metrike:</strong> Izračunavaju se izravno iz podataka platforme Decidim.</li>\n  <li><strong>Pitanja samoprocjene:</strong> Temelje se na obrascu koji ispunjava administrator.</li>\n</ol>\n\n<p>Svaki pokazatelj izražava se kao postotak.</p>\n\n<ul>\n  <li>1 = 0–20%</li>\n  <li>2 = 20–40%</li>\n  <li>3 = 40–60%</li>\n  <li>4 = 60–80%</li>\n  <li>5 = 80–100%</li>\n</ul>\n\n<br><br>\n<h3>Automatske metrike</h3>\n<p>Ove metrike automatski se izračunavaju iz dostupnih podataka u Decidimu. Procjenjuju\
            \ se po participativnom procesu i administratori ih mogu učiniti javnima.</p>\n\n<p>Definirali smo četiri glavna pokazatelja: Utjecaj građana, Hibridizacija, Odzivnost i Sljedivost.</p>\n\n<h3>Utjecaj građana</h3>\n<p>Ovaj pokazatelj mjeri razinu utjecaja građana na prihvaćene prijedloge i ishode procesa.</p>\n\n<ul>\n  <li>\n    Utjecaj građana na prijedloge\n    <ul>\n      <li>Postotak prihvaćenih prijedloga (n/ukupno)</li>\n      <li>Postotak odobrenih prijedloga <em>građana</em> od ukupnog broja prijedloga građana</li>\n      <li>Postotak odobrenih prijedloga građana od ukupnog broja odobrenih prijedloga</li>\n    </ul>\n  </li>\n  <li>\n    Utjecaj građana na rezultate\n    <ul>\n      <li>Postotak rezultata povezanih s prijedlozima građana od ukupnog broja rezultata</li>\n    </ul>\n  </li>\n</ul>\n\n<h3>Hibridizacija</h3>\n<p>Ovaj pokazatelj mjeri razinu kombinacije mrežnih i offline prostora tijekom procesa.</p>\n\n<ul>\n  <li>Je li komponenta sastanka aktivna? (Da=5,\
            \ Ne=0)</li>\n  <li>Postoje li sastanci uživo? (Da=5, Ne=0)</li>\n  <li>Postoje li mrežni sastanci? (Da=5, Ne=0)</li>\n  <li>Postoje li hibridni sastanci? (Da=5, Ne=0)</li>\n  <li>Postoje li prijedlozi stvoreni sa sastanaka? (Da=5, Ne=0)</li>\n</ul>\n\n<h3>Odzivnost</h3>\n<p>Ovaj pokazatelj mjeri razinu odzivnosti organizacije na input sudionika.</p>\n\n<ul>\n  <li>Postotak prijedloga s odgovorima (n/ukupno)</li>\n  <li>Postotak rezultata dovršenih 100% (n/ukupno)</li>\n</ul>\n\n<h3>Sljedivost</h3>\n<p>Ovaj pokazatelj mjeri transparentnost i sljedivost participativnog procesa.</p>\n\n<ul>\n  <li>Broj prijedloga s poviješću (n/ukupno)</li>\n  <li>Postotak rezultata povezanih s prijedlozima (n/ukupno)</li>\n  <li>Postotak sastanaka zatvorenih s objavljenim zapisnikom (n/ukupno)</li>\n  <li>Aktivacija open data modula (dihotomno: 0 ili 5)</li>\n  <li>Postotak prijedloga povezanih s proračunima (n/ukupno)</li>\n</ul>\n\n<br><br>\n<h3>Metrike samoprocjene</h3>\n<p>Uz automatske metrike,\
            \ predlažemo korištenje <strong>obrasca samoprocjene</strong> za procjenu kvalitativnih dimenzija svakog participativnog procesa. Ovaj obrazac ispunjavaju administratori platforme na kraju svakog procesa.</p>\n\n<br><br>\n<h3>Pitanja samoprocjene</h3>\n<p>Pitanja koja čine obrazac samoprocjene navedena su u nastavku.</p>\n\n<h4>Informativnost</h4>\n<ol>\n  <li>Pruža li objavljena informacija jasnoću o mehanizmima donošenja odluka?\n    <ul>\n      <li>Nema jasnoće = 0</li>\n      <li>Niska jasnoća = 1</li>\n      <li>Dovoljna jasnoća = 2,5</li>\n      <li>Potpuna jasnoća = 5</li>\n    </ul>\n  </li>\n  <li>Jesu li pružene informacije o sposobnosti sudionika da utječu na temu?\n    <ul>\n      <li>Nikada = 0</li>\n      <li>Gotovo nikada = 1</li>\n      <li>Obično = 2,5</li>\n      <li>Uvijek = 5</li>\n    </ul>\n  </li>\n</ol>\n\n<h4>Utjecaj građana</h4>\n<ol>\n  <li>Procjena stupnja participacije u procesu\n    <ul>\n      <li>Sudionici su primili informacije od organizacije.\
            \ = 1</li>\n      <li>Sudionici su konzultirani. = 2</li>\n      <li>Sudionici su uključeni u dijeljenje moći odlučivanja. = 3</li>\n      <li>Sudionici su odlučujuće uključeni u donošenje odluka. = 4</li>\n      <li>Sudionici su uključeni u donošenje odluka i upravljanje resursima. = 5</li>\n    </ul>\n  </li>\n</ol>\n\n<h4>Uključivost</h4>\n<ol>\n  <li>Kako se procjenjuje stupanj raznolikosti?\n    <ul>\n      <li>Nikako = 0</li>\n      <li>Nisko = 1</li>\n      <li>Dovoljno = 2,5</li>\n      <li>Dobro = 5</li>\n    </ul>\n  </li>\n  <li>Na koliko je jezika proces komuniciran?\n    <ul>\n      <li>Jedan jezik = 1</li>\n      <li>Manje od polovice jezika = 2,5</li>\n      <li>Više od polovice jezika = 5</li>\n    </ul>\n  </li>\n  <li>Jesu li prostori sastanaka pristupačni osobama smanjene pokretljivosti?\n    <ul>\n      <li>Ne = 0</li>\n      <li>Djelomično = 2,5</li>\n      <li>Da = 5</li>\n    </ul>\n  </li>\n  <li>Jesu li sesije zakazane u različitim terminima?\n    <ul>\n\
            \      <li>Ne = 0</li>\n      <li>Djelomično = 2,5</li>\n      <li>Da = 5</li>\n    </ul>\n  </li>\n  <li>Je li ponuđena digitalna podrška?\n    <ul>\n      <li>Ne = 0</li>\n      <li>Djelomično = 2,5</li>\n      <li>Da = 5</li>\n    </ul>\n  </li>\n</ol>"
          title: Pokazatelji demokratske kvalitete
