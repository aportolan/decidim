        participatory_processes:
          contextual: '<p><strong>Participativni proces</strong> je slijed participativnih aktivnosti (npr. prvo ispunjavanje ankete, zatim izrada prijedloga, rasprava o njima na sastancima uživo ili virtualno, i na kraju njihovo prioritziranje) s ciljem definiranja i donošenja odluke o specifičnoj temi.</p> <p>Primjeri participativnih procesa su: proces izbora članova odbora (gdje se kandidature prvo predstavljaju, zatim raspravljaju i na kraju bira), participativni proračuni (gdje se izrađuju prijedlozi, ekonomski vrednuju i glasaju s dostupnim novcem), proces strateškog planiranja, suradnička izrada propisa ili norme, dizajn urbanog prostora ili izrada plana javne politike.</p>

