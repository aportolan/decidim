      pabulib_rules:
        equalshares:
          help: Metoda jednakih udjela (MES) bez dovršetka. Kod MES-a svaki glasač počinje s jednakim virtualnim udjelom proračuna, a projekt se odabire kada ga njegovi podržavatelji zajedno mogu priuštiti.
          label: Metoda jednakih udjela (%{rule})
        equalshares/add1:
          help: Koristi osnovnu metodu jednakih udjela, ali ako prerano stane, nastavlja povećavati virtualni proračun svakog glasača za 1 jedinicu (Add1) i ponovno izračunava, sve dok odabrani projekti stanu u stvarni proračun.
          label: Metoda jednakih udjela, add1 (%{rule})
        equalshares/add1_comparison:
          help: Koristi equalshares/add1, a zatim primjenjuje isti korak usporedbe kao gore.
          label: Metoda jednakih udjela, add1 usporedba (%{rule})
        equalshares_comparison:
          help: 'Koristi osnovnu metodu jednakih udjela, a zatim dodaje još jedan korak: uspoređuje rezultat s pohlepnim mjerilom i prebacuje se samo ako više glasača preferira pohlepni ishod.'
          label: Metoda jednakih udjela, usporedba (%{rule})
        greedy:
          help: Standardni knapsack-pristup aproksimacije. Projekti se sortiraju po broju glasova (silazno). Algoritam prolazi kroz popis, odabirući projekte koji stanu u preostali proračun. Ako je projekt preskup za trenutna sredstva, preskače se i algoritam prelazi na sljedeći projekt.
          label: Pohlepni (%{rule})
        greedy_custom:
          help: Koristi se za posebne slučajeve koji ne odgovaraju standardnim algoritmima, poput ručnih preraspodjela proračuna ili složenih hibridnih pravila.
          label: Pohlepni, prilagođeno (%{rule})
        greedy_exclusive:
          help: Obrađuje sukobljene grupe projekata. Funkcionira kao standardni pohlepni, ali ako se više 'pobjedničkih' projekata sukobljava (npr. u istoj ekskluzivnoj zoni ili kategoriji), primjenjuje se hijerarhijsko pravilo umjesto oslanjanja isključivo na broj glasova.
          label: Pohlepni, ekskluzivno (%{rule})
        greedy_no_skip:
          help: Projekti se sortiraju po broju glasova (silazno). Algoritam odabire projekte koji stanu u preostali proračun, ali se zaustavlja odmah na prvom projektu koji ne stane. Naknadni projekti se ne razmatraju.
          label: Pohlepni, bez preskakanja (%{rule})
        greedy_threshold:
          help: Ponaša se kao standardni pohlepni, ali se projekti razmatraju samo ako zadovoljavaju definirani min_project_score_threshold.
          label: Pohlepni, prag (%{rule})
        unknown:
          help: Ili informacija nije dostupna, ili je bilo više mogućnosti i nejasno je koja se primjenjuje.
          label: Nepoznato (%{rule})
