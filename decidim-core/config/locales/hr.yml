        detailed:
          body_1: 'U nastavku je opis svakog skupa podataka, uključujući njegovu shemu (strukturu) i vrstu informacija koje sadrži:'
          title: Detaljno objašnjenje svake datoteke
          spaces: Participativni prostori
          components: Komponente
        download_open_data: Preuzmite sve Open Data datoteke
        explanation:
          body_2: Ove datoteke su u CSV (Comma-Separated Values) formatu, široko korištenom formatu datoteka koji se može otvarati i obrađivati raznim softverskim aplikacijama, uključujući programe za proračunske tablice, uređivače teksta i alate za analizu podataka.
          title: Što su ove datoteke?
          body_1: Ove datoteke su skupovi podataka izvezeni iz participativnih procesa %{organization_name}, poput prijedloga, komentara i sastanaka. Pružaju sirove, strukturirane podatke koji se mogu koristiti za analizu, istraživanje ili integraciju s drugim alatima. Podaci se automatski ažuriraju svaka 24 sata, osiguravajući pristup najnovijim informacijama.
        download:
          spaces: Participativni prostori
          core: Jezgra
          title: Preuzmite resurse
