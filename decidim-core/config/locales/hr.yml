        description: Dobrodošli na Open Data stranicu %{organization_name}. Ovdje ćete pronaći podatkovne datoteke koje se redovito generiraju iz različitih deliberativnih i upravljačkih procesa unutar %{organization_name}. Ove datoteke dostupne su radi promicanja transparentnosti, pristupačnosti i suradnje. U nastavku ćete pronaći detaljne informacije o tome što su ove datoteke, kako ih otvoriti i raditi s njima te opis sadržaja i strukture svake datoteke.
