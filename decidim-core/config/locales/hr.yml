        instructions_1: Ako imate pristup tom računu e-pošte, provjerite svoju pristiglu poštu za upute.
        body_1: 'Javljamo vam se kako bismo vas obavijestili o važnom ažuriranju Grupe korisnika čiji ste član: <strong>%{group_name}</strong>.'
      notify_deprecation_to_owner:
        subject: Važno ažuriranje u vezi s vašim profilom Grupe
        greeting: Poštovani %{name},
        instructions_2: 'Podijelite vjerodajnice za prijavu (e-pošta: %{email} i nova lozinka) sa svojim kolegama.'
        body_1: Javljamo vam se kako bismo vas obavijestili o važnom ažuriranju u vezi s vašim profilom Grupe na %{organization_name}.
        instructions_1: 'Kliknite poveznicu u nastavku za postavljanje lozinke:'
        body_3: Za nastavak pristupa vašem računu i dijeljenje pristupa, trebamo postaviti lozinku. Nakon što je postavite, vjerodajnice za prijavu (e-poštu i lozinku) možete podijeliti s bilo kim.
        instructions_title: <strong>Što trebate učiniti</strong>
        set_password: Postavite lozinku
        body_2: Kao dio naših napora za pojednostavljenje i poboljšanje iskustva organizacija poput vaše, ukidamo značajku "Grupe korisnika". Vaša Grupa, <strong>%{name}</strong>, pretvorena je u običan račun.
    open_data:
      index:
        how_to:
          step_2:
            title: 2. Otvorite datoteke
            body_html: "<ul>\n  <li><b>Aplikacije za proračunske tablice</b>: CSV datoteke možete otvoriti aplikacijama poput Microsoft Excela, Google Sheetsa ili LibreOffice Calca. Jednostavno otvorite aplikaciju, zatim odaberite \"Otvori\" iz izbornika Datoteka i odaberite preuzetu CSV datoteku.</li>\n  <li><b>Uređivači teksta</b>: CSV datoteke mogu se otvoriti i u bilo kojem uređivaču teksta, poput Notepada ili Sublime Texta. To će prikazati sirove podatke, gdje svaki redak predstavlja red, a svaka vrijednost odvojena je zarezom.</li>\n  <li><b>Alati za analizu podataka</b>: Ako poznajete alate za analizu podataka poput Pythona (s pandas), R ili SQL baza podataka, možete izravno uvesti ove CSV datoteke za obradu i analizu.</li>\n</ul>"
          step_3:
            body_html: "<ul>\n  <li><b>Filtriranje i sortiranje</b>: U aplikacijama za proračunske tablice možete filtrirati i sortirati podatke kako biste se usredotočili na specifične podskupove informacija.</li>\n  <li><b>Analiza</b>: Koristite podatke za razne analize, poput brojanja prijedloga, analize trendova u komentarima ili procjene sudjelovanja na sastancima.</li>\n  <li><b>Vizualizacija</b>: Možete izraditi grafikone i druge vizualizacije za tumačenje podataka.</li>\n</ul>"
            title: 3. Rad s podacima
          step_1:
            title: 1. Preuzmite datoteke
            body_html: Kliknite na poveznice u nastavku za preuzimanje CSV datoteka na svoje računalo.
          title: Kako otvoriti i raditi s ovim datotekama
