      api_users:
        index:
          manage: Upravljaj API korisnicima
          explanation_html: '<p>API korisnici omogućuju programerima integracija dodavanje administrativnih strojnih korisničkih računa u sustav. Ti strojni korisnici mogu djelovati kao administratori na platformi i izvršavati ažuriranja koja bi normalni administratori izvršavali putem administratorske ploče. Tipičan slučaj je vanjska platforma za upravljanje gdje bi automatizirana skripta izvršavala administrativne zadatke bez da se stvarni korisnik mora autenticirati u sustav. Na primjer, sustav automatizacije mogao bi slati odgovore na prijedloge, u kojem slučaju trebamo integracijskog korisnika za taj zadatak.</p>

            <p>Glavna razlika između ovih računa i normalnih administratorskih računa je da su ovi korisnici namijenjeni strojevima te su stoga njihovi zahtjevi za lozinkom drugačiji. Ti korisnici ne moraju redovito ažurirati lozinku, a promjena lozinke može se obaviti na upravljan način po potrebi.</p>

            <p>Ove vjerodajnice namijenjene su strojevima. Aplikacije okrenute sudionicima trebale bi se integrirati s <a href="%{oauth_link}">OAuth aplikacijama</a>.</p>

            '
